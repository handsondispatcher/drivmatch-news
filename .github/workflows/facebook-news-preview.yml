name: Create approved Facebook News previews

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build_facebook_news_previews.py'
      - 'site/facebook-pt.html'
      - 'site/facebook-en.html'
      - 'site/facebook-es.html'
      - 'docs/facebook-previews-image-credits.md'
      - '.github/workflows/facebook-news-preview.yml'

permissions:
  contents: write
  actions: write

jobs:
  prepare-facebook-previews:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout newspaper and approved master logo
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install 'Pillow==11.3.0'
      - name: Generate four-vehicle 1200x630 images in PT EN ES
        run: python scripts/build_facebook_news_previews.py
      - name: Validate all Open Graph images and native share pages
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          site=Path('site')
          for lang in ('pt','en','es'):
              pic=site/'assets'/f'facebook-news-{lang}.jpg'
              page=site/f'facebook-{lang}.html'
              assert pic.is_file() and page.is_file()
              with Image.open(pic) as im:
                  assert im.format=='JPEG' and im.size==(1200,630)
              html=page.read_text()
              assert f'assets/facebook-news-{lang}.jpg' in html
              assert f'og:image' in html
              assert f'utm_campaign=logistics_{lang}' in html
              assert 'drivmatch.com/news/' in html
              print(lang,'PHOTO_AND_OPEN_GRAPH_PASS',pic.stat().st_size)
          PY
      - name: Save exact rendered previews for visual inspection
        uses: actions/upload-artifact@v4
        with:
          name: approved-news-facebook-pt-en-es-1200x630
          path: site/assets/facebook-news-*.jpg
          retention-days: 14
      - name: Commit actual JPEG assets in the newspaper repository
        run: |
          git config user.name "drivmatch-news-automation"
          git config user.email "actions@users.noreply.github.com"
          git add site/assets/facebook-news-pt.jpg site/assets/facebook-news-en.jpg site/assets/facebook-news-es.jpg
          if git diff --cached --quiet; then
            echo "Social previews unchanged"; exit 0
          fi
          git commit -m "assets(social): publish official-master four-vehicle previews PT EN ES"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - name: Publish the new static pages and JPEGs on GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
