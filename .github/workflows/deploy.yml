name: Publicar DrivMatch News
on:
  push:
    branches: [main, drivmatch-weather-b3-v22]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'  # alvo: a cada 10 min; GitHub Actions não garante execução exata
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: drivmatch-news-pages-recovery-v2
  cancel-in-progress: false
jobs:
  build:
    timeout-minutes: 12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependência para cards sociais 1200x630
        run: python -m pip install Pillow==11.3.0
      - name: Testes de publicação e interface
        run: |
          python -m unittest discover -s tests
          node tests/test_client.js
      # Road TV discovery queries are cached by UTC hour across 10-minute
      # publication runs (3 rotating YouTube searches/hour max).
      - name: Janela de descoberta Road TV
        run: echo "ROADTV_CACHE_HOUR=$(date -u +%Y%m%d%H)" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: build/roadtv-discovery.json
          key: roadtv-discovery-v2-${{ env.ROADTV_CACHE_HOUR }}
          restore-keys: |
            roadtv-discovery-v2-
      - name: Atualizar conteúdo público e indicadores
        env:
          GOOGLE_TRANSLATE_API_KEY: ${{ secrets.GOOGLE_TRANSLATE_API_KEY }}
          FINNHUB_REDISTRIBUTION_AUTHORIZED: ${{ vars.FINNHUB_REDISTRIBUTION_AUTHORIZED }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          DRIVMATCH_PUBLIC_OPPORTUNITIES_URL: ${{ vars.DRIVMATCH_PUBLIC_OPPORTUNITIES_URL }}
          DRIVMATCH_PUBLIC_FEED_TOKEN: ${{ secrets.DRIVMATCH_PUBLIC_FEED_TOKEN }}
          DRIVMATCH_PUBLICATION_MODE: production
          USDBRL_SPOT_URL: ${{ vars.USDBRL_SPOT_URL }}
          USDBRL_REDISTRIBUTION_AUTHORIZED: ${{ vars.USDBRL_REDISTRIBUTION_AUTHORIZED }}
          USDBRL_PUBLIC_URL: ${{ vars.USDBRL_PUBLIC_URL }}
          CLASS8_DATA_URL: ${{ vars.CLASS8_DATA_URL }}
          CLASS8_REDISTRIBUTION_AUTHORIZED: ${{ vars.CLASS8_REDISTRIBUTION_AUTHORIZED }}
          USDBRL_SPOT_TOKEN: ${{ secrets.USDBRL_SPOT_TOKEN }}
          YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: python scripts/update.py
      - name: Verificar, baixar e servir fotos editoriais licenciadas
        run: python scripts/build_news_photos.py --ci
      - name: Gerar links exclusivos e prévias para compartilhamento
        run: python scripts/build_share_pages.py
      - uses: actions/upload-artifact@v4
        with:
          name: editorial-review
          path: build/news-candidates.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Browser regression (bounded)
        timeout-minutes: 3
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: test-results/
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: site
  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verificar cartão social público após publicação
        run: |
          set -e
          SHARE="https://handsondispatcher.github.io/drivmatch-news/share/kodiak-charger-dallas-laredo-20261008/"
          curl --fail --location --silent --show-error --retry 6 --retry-delay 4 --retry-all-errors --max-time 18 "$SHARE" -o /tmp/drivmatch-share.html
          grep -q 'property="og:image"' /tmp/drivmatch-share.html
          grep -q 'og:image:width" content="1200"' /tmp/drivmatch-share.html
          curl --fail --location --silent --show-error --retry 6 --retry-delay 4 --retry-all-errors --max-time 18 "${SHARE}social.jpg" -o /tmp/drivmatch-social.jpg
          test "$(wc -c < /tmp/drivmatch-social.jpg)" -gt 10000
          echo "PUBLIC SOCIAL PREVIEW PASS: Open Graph HTML and photo JPEG are accessible"
          INDEX="https://handsondispatcher.github.io/drivmatch-news/"
          curl --fail --location --silent --show-error --retry 6 --retry-delay 4 --retry-all-errors --max-time 18 "$INDEX" -o /tmp/drivmatch-v34.8-index.html
          grep -q 'name="drivmatch-news-version" content="v34.8"' /tmp/drivmatch-v34.8-index.html
          grep -q 'data-site-version="v34.8"' /tmp/drivmatch-v34.8-index.html
          RELEASE="https://handsondispatcher.github.io/drivmatch-news/data/release.json"
          curl --fail --location --silent --show-error --retry 6 --retry-delay 4 --retry-all-errors --max-time 18 "$RELEASE" -o /tmp/drivmatch-v34.8-release.json
          python -c 'import json; x=json.load(open("/tmp/drivmatch-v34.8-release.json")); assert x["version"]=="v34.8" and x["public_launch_approved"] is False and x["lifecycle"]=="development_prelaunch"; print("VERSION v34.8 PASS: prelaunch contract consistent")'
          PHOTOS="https://handsondispatcher.github.io/drivmatch-news/data/news-images.json"
          curl --fail --location --silent --show-error --retry 6 --retry-delay 4 --retry-all-errors --max-time 18 "$PHOTOS" -o /tmp/drivmatch-news-images.json
          PHOTO=$(python -c 'import json; m=json.load(open("/tmp/drivmatch-news-images.json")); a=list(m["images"].values()); assert m["license_policy"]=="curated_commons" and len(a)>=16 and all(x["image"].startswith("assets/news-photos/") and x["image_credit"] and x["image_license"] for x in a); print(a[0]["image"])')
          curl --fail --location --silent --show-error --retry 6 --retry-delay 4 --retry-all-errors --max-time 18 "https://handsondispatcher.github.io/drivmatch-news/$PHOTO" -o /tmp/drivmatch-real-thumbnail.jpg
          python -c 'from pathlib import Path; b=Path("/tmp/drivmatch-real-thumbnail.jpg").read_bytes(); assert len(b)>10000 and b[:3]==bytes.fromhex("ffd8ff") and b[-2:]==bytes.fromhex("ffd9"); print("PHOTO THUMBNAILS PASS: real complete JPEG served from public origin")'
          LIVE="https://handsondispatcher.github.io/drivmatch-news/data/live-feed.json"
          curl --fail --location --silent --show-error --retry 6 --retry-delay 4 --retry-all-errors --max-time 18 "$LIVE" -o /tmp/drivmatch-live-feed.json
          python -c 'import json; x=json.load(open("/tmp/drivmatch-live-feed.json")); assert x["schema_version"]==1 and x["operational_alerts_integrated"] is False; assert all(not i["is_active_incident"] and i["severity"] is None for i in x["items"]); print("LIVE NEWS FEED PASS:",len(x["items"]),"fresh non-urgent items")'
          curl --fail --location --silent --show-error --retry 6 --retry-delay 4 --retry-all-errors --max-time 18 "https://handsondispatcher.github.io/drivmatch-news/assets/news-crawler.js" -o /tmp/drivmatch-crawler.js
          grep -q 'blockedPublisher' /tmp/drivmatch-crawler.js
          echo "READER ACCESS PASS: ticker geoblock filter published"
          ROADTV="https://handsondispatcher.github.io/drivmatch-news/data/road-tv.json"
          curl --fail --location --silent --show-error --retry 6 --retry-delay 4 --retry-all-errors --max-time 18 "$ROADTV" -o /tmp/drivmatch-roadtv.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/drivmatch-roadtv.json',encoding='utf-8'))
          assert d['schema_version']==2
          assert not d.get('current_live') or d['current_live'].get('live') is True
          print('ROAD TV CATALOG:',d.get('live_status'),'approved_candidates:',len(d.get('candidates',[])))
          if not d.get('candidates'):
              print('::warning::ROAD TV SOURCE BLOCKED: no verified current live or qualifying replay. Configure authorized YouTube/Twitch API credentials and verify the publisher allows embedding.')
          PY
          CAMERA_DIR="https://handsondispatcher.github.io/drivmatch-news/data/camera-source-network.json"
          curl --fail --location --silent --show-error --retry 6 --retry-delay 4 --retry-all-errors --max-time 18 "$CAMERA_DIR" -o /tmp/drivmatch-camera-sources.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/drivmatch-camera-sources.json',encoding='utf-8'))
          assert d['schema_version']==1 and d['all_camera_streams_verified'] is False
          by_id={x['id']:x for x in d['sources']}
          assert list(by_id)==['fl511-i4','peacebridge-usbound','nvroads-nevada','milecheck-cameras']
          assert all(x['verified_playing_live'] is False for x in by_id.values())
          assert sum('embed_url' in x for x in by_id.values())==1
          assert by_id['fl511-i4']['embed_url'].startswith('https://fl511.com/Map/EmbeddedMap?')
          assert by_id['milecheck-cameras']['display']=='external_link_only_license_required'
          print('CAMERA SOURCE NETWORK PASS: official FL511 map; border/Nevada/MileCheck are outbound only')
          PY
          curl --fail --location --silent --show-error --retry 6 --retry-delay 4 --retry-all-errors --max-time 18 "https://handsondispatcher.github.io/drivmatch-news/data/source-headlines.json" -o /tmp/drivmatch-source-headlines.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/drivmatch-source-headlines.json',encoding='utf-8'))
          print('NEWS AUDIT:',d.get('source_metrics'),'fresh_6h:',d.get('fresh_6h'),'fresh_12h:',d.get('fresh_12h'),'last_actual_headline:',d.get('latest_headline_at'))
          if not d.get('fresh_12h'):
              print('::warning::NEWS FRESHNESS BLOCKER: no newly verified headline in previous 12h, despite successful feed polling.')
          PY
          # A footer match does NOT prove the custom domain serves the same
          # version as GitHub Pages. Request the HTML and release contract via
          # fresh URLs, then report a version-specific, actionable diagnosis.
          BUST="$(date +%s)"
          DOMAIN="https://drivmatch.com/news/"
          if curl --fail --location --silent --show-error --retry 2 --max-time 18 \
              -H "Cache-Control: no-cache" \
              "${DOMAIN}?__release_probe=v34.8-${BUST}" -o /tmp/drivmatch-domain.html; then
            if grep -q 'name="drivmatch-news-version" content="v34.8"' /tmp/drivmatch-domain.html \
                && grep -q 'data-site-version="v34.8"' /tmp/drivmatch-domain.html; then
              echo "CUSTOM DOMAIN V34.8 PASS: custom domain HTML identifies v34.8"
            else
              echo "::warning::CUSTOM DOMAIN V34.8 MISMATCH: drivmatch.com/news/ does not serve v34.8 HTML; check Cloudflare route/proxy and caching. GitHub Pages is up-to-date."
              grep -oE 'name="drivmatch-news-version" content="[^"]+"' /tmp/drivmatch-domain.html || true
              grep -oE 'data-site-version="[^"]+"' /tmp/drivmatch-domain.html || true
              echo "CUSTOM DOMAIN HTML first line:"
              head -c 160 /tmp/drivmatch-domain.html; echo
            fi
          else
            echo "::warning::CUSTOM DOMAIN UNREACHABLE: confirm Cloudflare DNS, Worker routes and proxy for /news/."
          fi
          if curl --fail --location --silent --show-error --retry 2 --max-time 18 \
              -H "Cache-Control: no-cache" \
              "https://drivmatch.com/news/data/release.json?__release_probe=v34.8-${BUST}" \
              -o /tmp/drivmatch-domain-release.json; then
            python - <<'PY'
          import json
          with open('/tmp/drivmatch-domain-release.json',encoding='utf-8') as f:
              try: d=json.load(f)
              except (json.JSONDecodeError,UnicodeDecodeError): d={}
          print('CUSTOM DOMAIN RELEASE:',d.get('version','missing/invalid manifest'))
          if d.get('version')!='v34.8':
              print('::warning::CUSTOM DOMAIN RELEASE MISMATCH: /news/data/release.json does not report v34.8. Cloudflare routing or cache differs from GitHub Pages.')
          PY
          else
            echo "::warning::CUSTOM DOMAIN MANIFEST UNAVAILABLE: /news/data/release.json not served at custom domain."
          fi
