name: Publicar DrivMatch News
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'  # alvo: a cada 30 min, sem SLA exato
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: drivmatch-news-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Atualizar conteúdo público e indicadores
        env:
          GOOGLE_TRANSLATE_API_KEY: ${{ secrets.GOOGLE_TRANSLATE_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          DRIVMATCH_PUBLIC_OPPORTUNITIES_URL: ${{ vars.DRIVMATCH_PUBLIC_OPPORTUNITIES_URL }}
          DRIVMATCH_PUBLIC_FEED_TOKEN: ${{ secrets.DRIVMATCH_PUBLIC_FEED_TOKEN }}
          DRIVMATCH_PUBLICATION_MODE: ${{ vars.DRIVMATCH_PUBLICATION_MODE }}
        run: python scripts/update.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
