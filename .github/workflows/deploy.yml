name: Publicar DrivMatch News
on:
  push:
    branches: [main, drivmatch-weather-b3-v22]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'  # alvo: a cada 10 min; GitHub Actions não garante execução exata
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: drivmatch-news-pages-recovery-v2
  cancel-in-progress: false
jobs:
  build:
    timeout-minutes: 12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependência para cards sociais 1200x630
        run: python -m pip install Pillow==11.3.0
      - name: Testes de publicação e interface
        run: |
          python -m unittest discover -s tests
          node tests/test_client.js
      - name: Atualizar conteúdo público e indicadores
        env:
          GOOGLE_TRANSLATE_API_KEY: ${{ secrets.GOOGLE_TRANSLATE_API_KEY }}
          FINNHUB_REDISTRIBUTION_AUTHORIZED: ${{ vars.FINNHUB_REDISTRIBUTION_AUTHORIZED }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          DRIVMATCH_PUBLIC_OPPORTUNITIES_URL: ${{ vars.DRIVMATCH_PUBLIC_OPPORTUNITIES_URL }}
          DRIVMATCH_PUBLIC_FEED_TOKEN: ${{ secrets.DRIVMATCH_PUBLIC_FEED_TOKEN }}
          DRIVMATCH_PUBLICATION_MODE: production
          USDBRL_SPOT_URL: ${{ vars.USDBRL_SPOT_URL }}
          USDBRL_REDISTRIBUTION_AUTHORIZED: ${{ vars.USDBRL_REDISTRIBUTION_AUTHORIZED }}
          USDBRL_PUBLIC_URL: ${{ vars.USDBRL_PUBLIC_URL }}
          CLASS8_DATA_URL: ${{ vars.CLASS8_DATA_URL }}
          CLASS8_REDISTRIBUTION_AUTHORIZED: ${{ vars.CLASS8_REDISTRIBUTION_AUTHORIZED }}
          USDBRL_SPOT_TOKEN: ${{ secrets.USDBRL_SPOT_TOKEN }}
        run: python scripts/update.py
      - name: Verificar, baixar e servir fotos editoriais licenciadas
        run: python scripts/build_news_photos.py --ci
      - name: Gerar links exclusivos e prévias para compartilhamento
        run: python scripts/build_share_pages.py
      - uses: actions/upload-artifact@v4
        with:
          name: editorial-review
          path: build/news-candidates.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Browser regression (bounded)
        timeout-minutes: 3
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: test-results/
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: site
  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verificar cartão social público após publicação
        run: |
          set -e
          SHARE="https://handsondispatcher.github.io/drivmatch-news/share/kodiak-charger-dallas-laredo-20261008/"
          curl --fail --location --silent --show-error --retry 6 --retry-delay 4 --retry-all-errors --max-time 18 "$SHARE" -o /tmp/drivmatch-share.html
          grep -q 'property="og:image"' /tmp/drivmatch-share.html
          grep -q 'og:image:width" content="1200"' /tmp/drivmatch-share.html
          curl --fail --location --silent --show-error --retry 6 --retry-delay 4 --retry-all-errors --max-time 18 "${SHARE}social.jpg" -o /tmp/drivmatch-social.jpg
          test "$(wc -c < /tmp/drivmatch-social.jpg)" -gt 10000
          echo "PUBLIC SOCIAL PREVIEW PASS: Open Graph HTML and photo JPEG are accessible"
          INDEX="https://handsondispatcher.github.io/drivmatch-news/"
          curl --fail --location --silent --show-error --retry 6 --retry-delay 4 --retry-all-errors --max-time 18 "$INDEX" -o /tmp/drivmatch-v32-index.html
          grep -q 'name="drivmatch-news-version" content="v32"' /tmp/drivmatch-v32-index.html
          grep -q 'data-site-version="v32"' /tmp/drivmatch-v32-index.html
          RELEASE="https://handsondispatcher.github.io/drivmatch-news/data/release.json"
          curl --fail --location --silent --show-error --retry 6 --retry-delay 4 --retry-all-errors --max-time 18 "$RELEASE" -o /tmp/drivmatch-v32-release.json
          python -c 'import json; x=json.load(open("/tmp/drivmatch-v32-release.json")); assert x["version"]=="v32" and x["public_launch_approved"] is False and x["lifecycle"]=="development_prelaunch"; print("VERSION v32 PASS: prelaunch contract consistent")'
          PHOTOS="https://handsondispatcher.github.io/drivmatch-news/data/news-images.json"
          curl --fail --location --silent --show-error --retry 6 --retry-delay 4 --retry-all-errors --max-time 18 "$PHOTOS" -o /tmp/drivmatch-news-images.json
          PHOTO=$(python -c 'import json; m=json.load(open("/tmp/drivmatch-news-images.json")); a=list(m["images"].values()); assert m["license_policy"]=="curated_commons" and len(a)>=4 and all(x["image"].startswith("assets/news-photos/") and x["image_credit"] and x["image_license"] for x in a); print(a[0]["image"])')
          curl --fail --location --silent --show-error --retry 6 --retry-delay 4 --retry-all-errors --max-time 18 "https://handsondispatcher.github.io/drivmatch-news/$PHOTO" -o /tmp/drivmatch-real-thumbnail.jpg
          python -c 'from PIL import Image; p=Image.open("/tmp/drivmatch-real-thumbnail.jpg"); p.verify(); print("PHOTO THUMBNAILS PASS: verified JPEG served from local origin")'
          LIVE="https://handsondispatcher.github.io/drivmatch-news/data/live-feed.json"
          curl --fail --location --silent --show-error --retry 6 --retry-delay 4 --retry-all-errors --max-time 18 "$LIVE" -o /tmp/drivmatch-live-feed.json
          python -c 'import json; x=json.load(open("/tmp/drivmatch-live-feed.json")); assert x["schema_version"]==1 and x["operational_alerts_integrated"] is False; assert all(not i["is_active_incident"] and i["severity"] is None for i in x["items"]); print("LIVE NEWS FEED PASS:",len(x["items"]),"fresh non-urgent items")'
          curl --fail --location --silent --show-error --retry 6 --retry-delay 4 --retry-all-errors --max-time 18 "https://handsondispatcher.github.io/drivmatch-news/assets/news-crawler.js" -o /tmp/drivmatch-crawler.js
          grep -q 'blockedPublisher' /tmp/drivmatch-crawler.js
          echo "READER ACCESS PASS: ticker geoblock filter published"
          if curl --fail --location --silent --show-error --max-time 12 https://drivmatch.com/news/ -o /tmp/drivmatch-domain.html; then
            if grep -q 'um produto da Hands On Dispatcher LLC' /tmp/drivmatch-domain.html; then
              echo "CUSTOM DOMAIN PASS: updated publication footer found"
            else
              echo "::warning::Custom domain responded but new publisher footer was not found; check cache or proxy"
            fi
          else
            echo "::warning::Custom domain unavailable to the runner; check DNS or proxy"
          fi
