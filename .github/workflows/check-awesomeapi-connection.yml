name: Check AwesomeAPI Connection (private key)
on:
  push:
    branches: [main]
    paths:
      - 'scripts/check_awesomeapi_credential.py'
      - '.github/workflows/check-awesomeapi-connection.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test authenticated USD-BRL API access (without publishing data)
        env:
          AWESOMEAPI_API_KEY: ${{ secrets.AWESOMEAPI_API_KEY }}
        run: python scripts/check_awesomeapi_credential.py
