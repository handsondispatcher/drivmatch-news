name: Verify live market UI on both domains
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-live-market-ui.yml'
      - 'scripts/check_live_market_ui.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm real domains do not serve outdated vendor widgets
        run: python scripts/check_live_market_ui.py
